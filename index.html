<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cary Review Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#F4F6F8; --panel:#FFFFFF; --panel-2:#EDF0F3; --line:#D9DEE4; --line-strong:#B8C0CA;
  --ink:#171C24; --ink-2:#4B5563; --ink-3:#7B8794;
  --accent:#0F6E6E; --accent-ink:#FFFFFF;
  --gotacase:#1F4FB5; --final-affairs:#6B4A7A; --shared:#0F6E6E;
  --draft:#8A94A0; --in-review:#B7791F; --approved:#2F855A; --changes-requested:#C0392B;
  --draft-bg:#EEF1F4; --in-review-bg:#FBF1DC; --approved-bg:#E3F3EA; --changes-requested-bg:#FBE4E1;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --shadow:0 1px 2px rgba(23,28,36,.06),0 8px 24px -12px rgba(23,28,36,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14181E; --panel:#1B2129; --panel-2:#232B35; --line:#2C3541; --line-strong:#3E4956;
    --ink:#E9EDF1; --ink-2:#AEB8C3; --ink-3:#7D8895;
    --accent:#3FB3B3; --accent-ink:#0B1416;
    --gotacase:#7BA0F0; --final-affairs:#B48CC6; --shared:#3FB3B3;
    --draft:#8A94A0; --in-review:#E0A94A; --approved:#5CBE87; --changes-requested:#E56B5D;
    --draft-bg:#252C35; --in-review-bg:#332A18; --approved-bg:#183126; --changes-requested-bg:#3A2220;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181E; --panel:#1B2129; --panel-2:#232B35; --line:#2C3541; --line-strong:#3E4956;
  --ink:#E9EDF1; --ink-2:#AEB8C3; --ink-3:#7D8895;
  --accent:#3FB3B3; --accent-ink:#0B1416;
  --gotacase:#7BA0F0; --final-affairs:#B48CC6; --shared:#3FB3B3;
  --draft:#8A94A0; --in-review:#E0A94A; --approved:#5CBE87; --changes-requested:#E56B5D;
  --draft-bg:#252C35; --in-review-bg:#332A18; --approved-bg:#183126; --changes-requested-bg:#3A2220;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ── Top bar ── */
header.top{display:flex;align-items:center;gap:16px;padding:0 20px;height:60px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:500 15px var(--sans);letter-spacing:.01em;white-space:nowrap}
.brand button{padding:0;font:inherit;color:inherit}
.brand button:hover{color:var(--accent)}
.companies{display:flex;gap:4px;padding:3px;background:var(--panel-2);border-radius:8px}
.companies button{white-space:nowrap;padding:7px 14px;border-radius:6px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.companies button .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.companies button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}
.scope{display:flex;gap:2px;padding:3px;background:var(--panel-2);border-radius:8px}
.scope button{white-space:nowrap;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
.scope button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.scope .n{font:400 12px var(--mono);color:var(--ink-3);margin-left:6px}
.headlink{font:500 13px var(--sans);color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap}
.headlink:hover{background:var(--panel-2);color:var(--ink)}

/* ── Layout ── */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
main{display:grid;grid-template-columns:300px 1fr;min-height:0}
nav.side{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 10px 30px}
.sec{margin-bottom:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:4px 10px 6px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.item{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:8px;text-align:left;color:var(--ink-2)}
.item:hover{background:var(--panel-2);color:var(--ink)}
.item[aria-current="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--c)}
.item .num{font:500 12px var(--mono);color:var(--ink-3);text-align:right}
.item[aria-current="true"] .num{color:var(--c)}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.st{width:8px;height:8px;border-radius:50%;background:var(--s);flex:none}
.empty-sec{padding:2px 10px 6px;font:12px var(--mono);color:var(--ink-3)}

/* ── Viewer ── */
.view{display:grid;grid-template-rows:auto auto 1fr;min-height:0;min-width:0}
.viewbar{display:flex;align-items:center;gap:14px;padding:0 20px;height:64px;border-bottom:1px solid var(--line);background:var(--panel)}
.navbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:14px;color:var(--ink)}
.navbtn:hover:not(:disabled){border-color:var(--line-strong);background:var(--panel-2)}
.navbtn:disabled{opacity:.4;cursor:default}
.navbtn.next{background:var(--c);border-color:var(--c);color:#fff}
.navbtn.next:hover:not(:disabled){filter:brightness(1.08);background:var(--c)}
.title{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px}
.title .t{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title .sub{font:12px var(--mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title .sub b{color:var(--c);font-weight:500}
.count{font:500 13px var(--mono);color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:var(--s);background:var(--sbg);border:1px solid color-mix(in srgb,var(--s) 35%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--s)}
.more{position:relative}
.more summary{list-style:none;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);color:var(--ink-2)}
.more summary::-webkit-details-marker{display:none}
.more summary:hover{background:var(--panel-2)}
.more .menu{position:absolute;right:0;top:46px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:50;display:flex;flex-direction:column}
.more .menu a{display:block;padding:9px 12px;border-radius:6px;font-size:14px;text-decoration:none;color:var(--ink)}
.more .menu a:hover{background:var(--panel-2)}
.more .menu .k{padding:6px 12px 2px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.note{display:flex;gap:12px;align-items:baseline;padding:10px 20px;background:var(--in-review-bg);border-bottom:1px solid var(--line);font-size:14px}
.note b{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--in-review);white-space:nowrap}
.stage{position:relative;min-height:0;overflow:auto;background:var(--bg)}
.stage iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.frame-wrap{height:100%;display:flex;flex-direction:column}
.frame-wrap.phone{align-items:center;justify-content:flex-start;padding:24px 0;background:
  repeating-conic-gradient(var(--panel-2) 0 25%,transparent 0 50%) 0 0/24px 24px}
.frame-wrap.phone iframe{width:430px;max-width:100%;height:calc(100% - 0px);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.fit{position:absolute;top:12px;right:16px;display:flex;gap:2px;padding:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:5}
.fit button{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink-2)}
.fit button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.prose{max-width:72ch;margin:0 auto;padding:40px 32px 80px;font-size:16px;line-height:1.65}
.prose h1,.prose h2,.prose h3{text-wrap:balance;line-height:1.2;margin:1.6em 0 .5em}
.prose h1{font-size:30px;margin-top:0}.prose h2{font-size:22px}.prose h3{font-size:17px}
.prose pre{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;font:13px/1.5 var(--mono)}
.prose code{font:.92em var(--mono);background:var(--panel-2);padding:.1em .35em;border-radius:4px}
.prose pre code{background:none;padding:0}
.prose table{border-collapse:collapse;width:100%;font-size:14px}
.prose th,.prose td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--panel-2)}
.prose img{max-width:100%;border-radius:6px}
.prose blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--line-strong);color:var(--ink-2)}
.imgwrap{display:grid;place-items:center;padding:40px;min-height:100%;background:
  repeating-conic-gradient(var(--panel-2) 0 25%,transparent 0 50%) 0 0/24px 24px}
.imgwrap img{max-width:100%;max-height:calc(100vh - 170px);box-shadow:var(--shadow);background:#fff}
.codewrap{padding:24px 32px}
.codewrap pre{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;overflow-x:auto;font:13px/1.55 var(--mono);color:var(--ink)}
.dl{display:grid;place-items:center;height:100%;text-align:center;color:var(--ink-2)}
.dl .big{font:500 40px/1 var(--mono);color:var(--ink-3);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:14px;text-decoration:none;color:var(--ink-2)}
.btn.primary{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}

/* ── Overview / start screen ── */
.start{max-width:880px;margin:0 auto;padding:56px 32px 80px}
.start h2{font:600 clamp(30px,3.4vw,40px)/1.1 var(--serif);margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance;color:var(--c)}
.start .lede{color:var(--ink-2);margin:0 0 30px;max-width:60ch;font-size:16px}
.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:40px}
.cta .navbtn{height:48px;padding:0 22px;font-size:15px}
.cta .hint{font:13px var(--mono);color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.stat:hover{border-color:var(--line-strong)}
.stat .k{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--s);display:flex;align-items:center;gap:7px}
.stat .k::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s)}
.stat .v{font:500 30px/1 var(--sans);font-variant-numeric:tabular-nums}
.toc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.toc h3{margin:0;padding:12px 18px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line)}
.toc ol{list-style:none;margin:0;padding:0}
.toc li button{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;width:100%;padding:12px 18px;text-align:left;border-bottom:1px solid var(--line)}
.toc li:last-child button{border-bottom:0}
.toc li button:hover{background:var(--panel-2)}
.toc .num{font:500 13px var(--mono);color:var(--ink-3)}
.toc .nm{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc .sm{font:12px var(--mono);color:var(--ink-3)}
.toc .grp{padding:10px 18px 4px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--panel-2)}
.errbox{margin:60px auto;max-width:56ch;padding:22px 24px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.errbox h2{margin:0 0 8px;font-size:18px}
.errbox code{font:13px var(--mono);background:var(--panel-2);padding:.15em .45em;border-radius:4px}
@media (max-width:900px){
  main{grid-template-columns:1fr}
  nav.side{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .scope,.count{display:none}
  .title .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><button id="home">Cary Review Hub</button></div>
    <div class="companies" id="companies" role="tablist"></div>
    <div class="spacer"></div>
    <div class="scope" id="scope"></div>
    <a class="headlink" id="decisions" href="#">Decisions</a>
  </header>
  <main>
    <nav class="side" id="side" aria-label="Files"></nav>
    <section class="view">
      <div class="viewbar" id="viewbar"></div>
      <div class="note hidden" id="note"></div>
      <div class="stage" id="stage"></div>
    </section>
  </main>
</div>

<script>
const STATUSES = ["draft","in-review","approved","changes-requested"];
const LABEL = {"draft":"Draft","in-review":"In review","approved":"Approved","changes-requested":"Changes requested"};
const state = { m:null, company:null, idx:-1, scope:"all", fit:"phone" };
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => { const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); };
const cvar = slug => `var(--${slug})`;
const svar = st => `--s:var(--${st});--sbg:var(--${st}-bg)`;
const pretty = name => name.replace(/\.[^.]+$/,"").replace(/^\d+[-_ ]+/,"").replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());

async function boot(){
  try{
    const r = await fetch("manifest.json",{cache:"no-store"}); if(!r.ok) throw 0;
    state.m = await r.json();
  }catch(e){
    $("#stage").innerHTML = `<div class="errbox"><h2>Couldn't load the file list</h2><p>If you opened this file directly from your computer, run <code>python3 -m http.server 8000</code> in the folder and open <code>http://localhost:8000</code>. On the live site this means <code>manifest.json</code> hasn't been built yet — push once and it will be.</p></div>`;
    return;
  }
  const hash = decodeURIComponent(location.hash.slice(1));
  const cos = state.m.companies.filter(c=>c.slug!=="shared" || c.sections.some(s=>s.files.length));
  state.m.companies = cos;
  state.company = cos.find(c=>hash===c.slug || hash.startsWith(c.slug+"/"))?.slug || cos[0]?.slug;
  renderTop();
  const list = files();
  const i = list.findIndex(f=>f.path===hash);
  if(i>=0) show(i); else if(hash==="DECISIONS.md") showDecisions(); else showStart();
  $("#home").addEventListener("click",showStart);
  $("#decisions").addEventListener("click",e=>{e.preventDefault();showDecisions();});
  document.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
    if(e.key==="ArrowRight"||e.key==="ArrowDown"){ e.preventDefault(); step(1); }
    if(e.key==="ArrowLeft"||e.key==="ArrowUp"){ e.preventDefault(); step(-1); }
  });
  window.addEventListener("hashchange",()=>{ const h=decodeURIComponent(location.hash.slice(1)); const j=files().findIndex(f=>f.path===h); if(j>=0 && j!==state.idx) show(j); });
}
function company(){ return state.m.companies.find(c=>c.slug===state.company); }
function allFiles(){ const c=company(); return c? c.sections.flatMap(s=>s.files.map(f=>({...f,section:s.label}))) : []; }
function files(){ const a=allFiles(); return state.scope==="review" ? a.filter(f=>f.status==="in-review"||f.status==="changes-requested") : a; }

function renderTop(){
  $("#companies").innerHTML = state.m.companies.map(c=>
    `<button role="tab" data-slug="${c.slug}" aria-pressed="${c.slug===state.company}" style="--c:${cvar(c.slug)}"><span class="dot"></span>${esc(c.name)}</button>`).join("");
  $("#companies").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ state.company=b.dataset.slug; state.idx=-1; renderTop(); showStart(); }));
  const a=allFiles(), waiting=a.filter(f=>f.status==="in-review"||f.status==="changes-requested").length;
  $("#scope").innerHTML = `<button data-s="all" aria-pressed="${state.scope==="all"}">Everything<span class="n">${a.length}</span></button><button data-s="review" aria-pressed="${state.scope==="review"}">Waiting on me<span class="n">${waiting}</span></button>`;
  $("#scope").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ state.scope=b.dataset.s; state.idx=-1; renderTop(); showStart(); }));
  renderSide();
}
function renderSide(){
  const c=company(); if(!c) return;
  const list=files(); let n=0;
  $("#side").innerHTML = c.sections.map(s=>{
    const fs=list.filter(f=>f.section===s.label);
    if(!fs.length && state.scope==="review") return "";
    return `<div class="sec"><div class="sec-h"><span>${esc(s.label)}</span><span>${fs.length||""}</span></div>
      ${fs.length? fs.map(f=>{ n++; const i=list.indexOf(f); return `<button class="item" data-i="${i}" aria-current="${i===state.idx}" style="--c:${cvar(c.slug)};${svar(f.status)}" title="${esc(f.path)}"><span class="num">${n}</span><span class="nm">${esc(pretty(f.name))}</span><span class="st" title="${LABEL[f.status]}"></span></button>`; }).join("")
        : `<div class="empty-sec">nothing here yet</div>`}</div>`;
  }).join("");
  $("#side").querySelectorAll(".item").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.i)));
}
function step(d){ const list=files(); if(!list.length) return; const j = state.idx<0 ? (d>0?0:list.length-1) : Math.min(list.length-1,Math.max(0,state.idx+d)); if(j!==state.idx) show(j); }

function show(i){
  const list=files(), f=list[i], c=company(); if(!f) return;
  state.idx=i; history.replaceState(null,"","#"+f.path); renderSide();
  const repo=state.m.repo;
  $("#viewbar").innerHTML = `
    <button class="navbtn" id="prev" ${i===0?"disabled":""}>‹ Previous</button>
    <div class="title"><div class="t">${esc(pretty(f.name))}</div><div class="sub"><b style="--c:${cvar(c.slug)}">${esc(c.name)}</b> · ${esc(f.section)} · ${esc(f.name)}${f.modified?` · updated ${fmtDate(f.modified)}`:""}</div></div>
    <span class="pill" style="${svar(f.status)}">${LABEL[f.status]}</span>
    <span class="count">${i+1} of ${list.length}</span>
    <details class="more"><summary aria-label="More options">···</summary><div class="menu">
      <div class="k">This file</div>
      <a href="${esc(f.path)}" target="_blank" rel="noopener">Open full size ↗</a>
      ${repo?`<a href="${repo}/edit/main/${esc(f.path)}" target="_blank" rel="noopener">Edit on GitHub ↗</a><a href="${repo}/commits/main/${esc(f.path)}" target="_blank" rel="noopener">Change history ↗</a>`:""}
    </div></details>
    <button class="navbtn next" id="next" style="--c:${cvar(c.slug)}" ${i===list.length-1?"disabled":""}>Next ›</button>`;
  $("#prev").addEventListener("click",()=>step(-1)); $("#next").addEventListener("click",()=>step(1));
  const note=$("#note");
  if(f.note){ note.innerHTML=`<b>For Cary</b><span>${esc(f.note)}</span>`; note.classList.remove("hidden"); } else note.classList.add("hidden");
  renderStage(f);
}
function renderStage(f){
  const stage=$("#stage"); stage.scrollTop=0;
  if(f.kind==="html"){
    const mobile=/mobile|phone/i.test(f.name);
    const fit = mobile ? state.fit : "full";
    stage.innerHTML=`<div class="frame-wrap ${fit==="phone"?"phone":""}"><iframe src="${esc(f.path)}" title="${esc(f.name)}"></iframe></div>
      ${mobile?`<div class="fit"><button data-f="phone" aria-pressed="${fit==="phone"}">Phone</button><button data-f="full" aria-pressed="${fit==="full"}">Full width</button></div>`:""}`;
    stage.querySelectorAll(".fit button").forEach(b=>b.addEventListener("click",()=>{ state.fit=b.dataset.f; renderStage(f); }));
  }else if(f.kind==="markdown"||f.kind==="text"||f.kind==="code"){
    stage.innerHTML=`<div class="prose" style="color:var(--ink-3)">Loading…</div>`;
    fetch(f.path,{cache:"no-store"}).then(r=>r.text()).then(t=>{
      if(f.kind==="markdown" && window.marked){
        const base=f.path.split("/").slice(0,-1).join("/");
        const html=marked.parse(t).replace(/(src|href)="(?!https?:|\/|#|mailto:)([^"]+)"/g,(m,a,p)=>`${a}="${base?base+"/":""}${p}"`);
        stage.innerHTML=`<article class="prose">${html}</article>`;
      }else stage.innerHTML=`<div class="codewrap"><pre>${esc(t)}</pre></div>`;
    }).catch(()=>{ stage.innerHTML=`<div class="errbox"><h2>Couldn't load this file</h2><p><code>${esc(f.path)}</code></p></div>`; });
  }else if(f.kind==="image"){
    stage.innerHTML=`<div class="imgwrap"><img src="${esc(f.path)}" alt="${esc(f.name)}"></div>`;
  }else if(f.kind==="pdf"){
    stage.innerHTML=`<div class="frame-wrap"><iframe src="${esc(f.path)}" title="${esc(f.name)}"></iframe></div>`;
  }else{
    stage.innerHTML=`<div class="dl"><div><div class="big">${esc(f.name.split(".").pop().toUpperCase())}</div><p>This file type can't be shown in the browser.</p><a class="btn primary" href="${esc(f.path)}" download>Download ${esc(f.name)}</a></div></div>`;
  }
}

function showStart(){
  const c=company(); if(!c) return;
  state.idx=-1; history.replaceState(null,"","#"+c.slug); renderSide(); $("#note").classList.add("hidden");
  const list=files(), all=allFiles();
  const counts=Object.fromEntries(STATUSES.map(s=>[s,all.filter(f=>f.status===s).length]));
  const waiting=counts["in-review"]+counts["changes-requested"];
  $("#viewbar").innerHTML=`<div class="title"><div class="t">${esc(c.name)}</div><div class="sub">${all.length} file${all.length===1?"":"s"}${waiting?` · ${waiting} waiting on you`:""}</div></div>`;
  let toc="", grp="", n=0;
  for(const f of list){ if(f.section!==grp){ grp=f.section; toc+=`<li class="grp">${esc(grp)}</li>`; } n++; toc+=`<li><button data-i="${n-1}" style="${svar(f.status)}"><span class="num">${n}</span><span class="nm">${esc(pretty(f.name))}</span><span class="pill">${LABEL[f.status]}</span></button></li>`; }
  $("#stage").innerHTML=`<div class="start" style="--c:${cvar(c.slug)}">
    <h2>${esc(c.name)}</h2>
    <p class="lede">${list.length? `Everything is in reading order. Press <strong>Start</strong> and click <strong>Next</strong> to walk through ${state.scope==="review"?"what's waiting on you":"all of it"}, one screen at a time.` : "Nothing here yet — files will appear as Nicolette and Angie add them."}</p>
    <div class="cta">${list.length?`<button class="navbtn next" id="start" style="--c:${cvar(c.slug)}">${waiting&&state.scope==="all"?"Start from the beginning ›":"Start ›"}</button>`:""}
      ${waiting&&state.scope==="all"?`<button class="navbtn" id="startReview">Just what's waiting on me (${waiting}) ›</button>`:""}
      ${list.length?`<span class="hint">tip: ← → arrow keys also work</span>`:""}</div>
    <div class="stats">${STATUSES.map(s=>`<div class="stat" style="${svar(s)}"><span class="k">${LABEL[s]}</span><span class="v">${counts[s]}</span></div>`).join("")}</div>
    ${list.length?`<div class="toc"><h3>Contents</h3><ol>${toc}</ol></div>`:""}
  </div>`;
  $("#start")?.addEventListener("click",()=>show(0));
  $("#startReview")?.addEventListener("click",()=>{ state.scope="review"; renderTop(); show(0); });
  $("#stage").querySelectorAll(".toc button").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.i)));
}
function showDecisions(){
  state.idx=-1; history.replaceState(null,"","#DECISIONS.md"); renderSide(); $("#note").classList.add("hidden");
  $("#viewbar").innerHTML=`<div class="title"><div class="t">Decisions</div><div class="sub">Cary's running log — newest first</div></div>${state.m.repo?`<a class="btn" href="${state.m.repo}/edit/main/DECISIONS.md" target="_blank" rel="noopener">Edit on GitHub ↗</a>`:""}`;
  renderStage({path:"DECISIONS.md",name:"DECISIONS.md",kind:"markdown"});
}
boot();
</script>
